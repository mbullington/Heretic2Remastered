// DOS defaults used when the retail installation's loose default.cfg is absent.

alias tutorial "map tutorial"
alias newgame "map intro.smk+ssdocks"
alias newcoopgame "map intro.smk+ssdocks"
alias endgame "map outro.smk@menu_credits"
alias demo_loop "menu_main"

bind Escape "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind Tab "score"
bind Pause "pause"

bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind e "+action"
bind Space "+moveup"
bind z "+movedown"
bind Shift "+speed"
bind Ctrl "+creep"

bind UpArrow "+forward"
bind DownArrow "+back"
bind LeftArrow "+left"
bind RightArrow "+right"
bind Del "+lookup"
bind PgDn "+lookdown"
bind End "centerview"

bind Mouse1 "+attack"
bind Mouse2 "+defend"
bind MWheelDown "weapprev"
bind MWheelUp "weapnext"
bind q "defprev"
bind r "defnext"

bind 1 "use staff"
bind 2 "use fball"
bind 3 "use hell"
bind 4 "use array"
bind 5 "use rain"
bind 6 "use fwall"
bind 7 "use phoen"
bind 8 "use sphere"
bind 9 "use mace"

bind F1 "menu_help"
bind F2 "menu_savegame"
bind F3 "menu_loadgame"
bind F4 "menu_options"
bind F5 "save quick"
bind F9 "load quick"
bind F12 "quit"

set cl_run "1"
set freelook "1"
set mouse_sensitivity_x "3.5"
set mouse_sensitivity_y "3.5"
set protocol "55"
set skin "male/Corvus"
set name "Corvus"
